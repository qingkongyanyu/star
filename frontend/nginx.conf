server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 商业版安全响应头（HTML/静态资源；API 响应头的安全由后端追加）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 健康检查（后端根路径）→ 后端服务
    location = /healthz {
        proxy_pass http://backend:8070/healthz;
        proxy_set_header Host $host;
    }

    # 就绪探针（DB/Redis/MinIO）→ 后端服务
    location = /readyz {
        proxy_pass http://backend:8070/readyz;
        proxy_set_header Host $host;
    }

    # API → 后端服务
    location /api/ {
        proxy_pass http://backend:8070/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket（群聊事件流）
    location /ws/ {
        proxy_pass http://backend:8070/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 静态资源 + SPA 路由回退
    location /assets/ { try_files $uri =404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
