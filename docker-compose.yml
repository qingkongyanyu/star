# 本地开发基础设施（中间件）。应用各自 Dockerfile 构建，不在此打包。
# 用法：docker compose up -d
# 对应文档：docs/05-DevOps/部署方案.md
#
# 精简架构：MySQL（业务/资产双库）+ Redis（事件总线/验证码/限流）+ MinIO（对象存储）+ Kafka（实时流数据源）
services:
  mysql:
    image: mysql:8.4
    container_name: midplat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task_repo
      TZ: Asia/Shanghai
    # 映射到宿主机 3307，避免与本机其他 MySQL（如 shizhen-mysql 占用 3306）冲突
    ports: ["3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init_mysql.sh:/docker-entrypoint-initdb.d/init_mysql.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: midplat-redis
    # 映射到宿主机 6381，避免与本机其他 Redis（milvus-redis 占 6379、shizhen-redis 占 6380）冲突
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.7.1
    container_name: midplat-kafka
    ports: ["9092:9092", "9094:9094"]
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    container_name: midplat-minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data: {}
  minio-data: {}
