[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-mid-platform-backend"
version = "3.2.0"
description = "星枢 StarPivot · 企业级 12-Agent 智能数据分析平台 · 后端"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1",
    "alembic>=1.13",
    "redis>=5.0",
    "kafka-python>=2.0.2",
    "minio>=7.2",
    "openai>=1.40",
    "python-jose[cryptography]>=3.5,<4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # 报告图表渲染（图文表并茂：把 ECharts 图表导出为 PNG 内嵌 Markdown）
    "matplotlib>=3.9",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]              # isort

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = ["integration: 依赖真实中间件的集成测试"]
