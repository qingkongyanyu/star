# ============================================================
# 星枢 StarPivot · 12-Agent 智能数据分析平台 · 商业版编排
# 用法：cp .env.cloud.example .env && 编辑 .env && docker compose -f compose.cloud.yml up -d --build
# 访问：前端 http://localhost:8080 · 后端 http://localhost:8070（ENV=prod 时不暴露 /docs）
# 探针：/healthz（存活）· /readyz（DB/Redis/MinIO 就绪）
#
# 精简架构：MySQL（业务/资产双库）+ Redis + MinIO + Kafka + 前后端应用
# 服务间通过 compose 网络以服务名互通（mysql/redis/minio/kafka/backend）。
# ============================================================
services:
  mysql:
    image: mysql:8.4
    container_name: midplat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?请在 .env 设置 MYSQL_APP_PASSWORD}
      MYSQL_DATABASE: task_repo
      TZ: Asia/Shanghai
    # 映射到宿主机 3307，避免与本机其他 MySQL（如 shizhen-mysql 占用 3306）冲突
    ports: ["3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init_mysql.sh:/docker-entrypoint-initdb.d/init_mysql.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    container_name: midplat-redis
    # 映射到宿主机 6381，避免与本机其他 Redis（milvus-redis 占 6379、shizhen-redis 占 6380）冲突
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.7.1
    container_name: midplat-kafka
    ports: ["9092:9092", "9094:9094"]
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    container_name: midplat-minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 设置 MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports: ["8070:8070"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENV: ${ENV:-prod}
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置强随机 JWT_SECRET（至少 32 位）}
      DATABASE_URL: mysql+pymysql://midplat:${MYSQL_APP_PASSWORD:?请在 .env 设置 MYSQL_APP_PASSWORD}@mysql:3306/task_repo
      ARTIFACT_DATABASE_URL: mysql+pymysql://midplat:${MYSQL_APP_PASSWORD:?请在 .env 设置 MYSQL_APP_PASSWORD}@mysql:3306/artifact_repo
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS_REDIS: "true"
      KAFKA_BOOTSTRAP: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?请在 .env 设置 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在 .env 设置 MINIO_SECRET_KEY}
      LLM_API_KEY: ${LLM_API_KEY:?请在 .env 设置 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.example.com/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      CORS_ORIGINS: ${CORS_ORIGINS:?请在 .env 设置前端域名}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?请在 .env 设置初始管理员账号}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请在 .env 设置强初始口令}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-30}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      AGENT_INPUT_FETCH_CONCURRENCY: ${AGENT_INPUT_FETCH_CONCURRENCY:-4}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      - backend

volumes:
  mysql-data: {}
  minio-data: {}
